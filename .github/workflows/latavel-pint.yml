name: Laravel Pint
on:
  push:
    branches:
      - main

jobs:
  laravel-pint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Setup cache environment
        id: pintcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: '8.3'
          key: 'cache_key_v1'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pintcache.outputs.dir }}
          key: ${{ steps.pintcache.outputs.key }}
          restore-keys: ${{ steps.pintcache.outputs.key }}

      - name: Install Laravel Pint
        run: composer global require laravel/pint

      - name: Run Laravel Pint
        run: pint

      - name: Push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github_action@laraforum.test'
          git add .
          git commit -m "Run Laravel Pint" || exit 0
          git push
